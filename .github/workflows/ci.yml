name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # build number = commit count
      - run: swift --version
      - name: Build (debug)
        run: swift build
      - name: Build app bundle (release)
        run: ./scripts/build-app.sh
      - name: Package
        run: ./scripts/package-release.sh
      - uses: actions/upload-artifact@v7
        with:
          name: PowerLevel-${{ github.sha }}
          path: build/PowerLevel-*.zip
          retention-days: 14
